<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17382a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Formel1-LOGGER">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Formel1-LOGGER</title>
<style>
:root{--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;--pl1:#184f95;--pl2:#2a78d6;--pl3:#6da7ec;--pl4:#b7d3f6;--grid:#e1e0d9;--zebra:#e6e1d2;--sec:#d3dccf;--bg:#f4f1ea;--card:#fff;--ink:#1d2a24;--mute:#6b766f;--line:#ddd8cb;--accent:#1f6b4a;--accent-ink:#fff;--bad:#b3322b;--good:#1f6b4a;--warn:#b7791f;--chip:#ece8dc}
@media (prefers-color-scheme:dark){:root{--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;--pl1:#b7d3f6;--pl2:#6da7ec;--pl3:#2a78d6;--pl4:#184f95;--grid:#2c2c2a;--zebra:#26392f;--sec:#34513f;--bg:#14201a;--card:#1d2d25;--ink:#e8efe9;--mute:#9aaba1;--line:#2f4439;--accent:#3fae7c;--accent-ink:#062014;--bad:#ef7b72;--good:#5fd09b;--warn:#e3b04f;--chip:#27392f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,Segoe UI,sans-serif;padding-bottom:90px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
h1{font-size:20px;margin:16px 0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn:disabled{background:#c3c6c1;color:#6c6f6a;cursor:not-allowed;opacity:1} /* grau = nicht bedienbar */
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn:disabled{background:#4a4d4a;color:#9a9d99}}
.btn.bad{background:var(--bad);color:#fff}
input[type=text],input[type=number],select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.top{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;border-bottom:1px solid var(--line)}
.pl{display:grid;gap:8px}
.p{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;min-width:0}
.p.deal{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.p .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p .tot{font-size:28px;font-weight:800;line-height:1.1}
.p .tag{font-size:11px;color:var(--mute);min-height:15px}
.banner{border-radius:10px;padding:8px 12px;margin:10px 0;font-size:14px;background:var(--chip)}
.banner.bock{border-left:5px solid var(--warn)}
.banner.mal{border-left:5px solid var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
#app table th,#app table td{border-left:1px solid var(--line)}
#app table th:first-child,#app table td:first-child{border-left:0}
tr.row{cursor:pointer}
.lost{color:var(--bad);font-weight:700}
.won{color:var(--good)}
.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:0 6px;font-size:12px;margin-right:3px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fab{position:fixed;right:16px;bottom:16px;box-shadow:0 4px 14px #0004;padding:14px 20px;font-size:17px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.prev{background:var(--chip);border-radius:10px;padding:10px 12px;margin:12px 0;font-weight:600}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0;color:var(--ink);font-size:15px}
.chk input{width:20px;height:20px}
.muted{color:var(--mute);font-size:13px}
.scroll{overflow-x:auto}
.pc{text-align:center}
#app tr.cyc td{border-bottom:4px solid var(--ink)}
.sheet.wide{max-width:980px}
/* Fenster offen: Seite dahinter nicht mitscrollen (Wischen in Tabelle/Fenster darf nie die Hintergrundseite bewegen) */
body.lock{overflow:hidden}
.modal,.sheet,.statwrap{overscroll-behavior:contain}
.btn.sm{padding:4px 10px;font-size:13px}
.nb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.nb.x{margin-left:auto}
.navbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;position:sticky;top:-16px;z-index:3;background:var(--bg);margin:-16px -16px 8px;padding:8px 16px}
.podi{display:block;margin:0 auto 2px}
.btnbar .btn{padding:9px 10px;font-size:14px;min-height:38px;white-space:nowrap}
.btnbar{position:sticky;bottom:-16px;z-index:3;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;background:var(--bg);border-top:1px solid var(--line);margin:14px 0 -16px;padding:10px 0}
.statwrap.ov tbody tr.pin td{position:sticky;z-index:2}
.statwrap.ov tbody tr.pin td:first-child{z-index:3}
.statwrap.ov tbody tr.pin1 td{top:var(--hdH,76px)}
.statwrap.ov tbody tr.pin2 td{top:calc(var(--hdH,76px) + var(--p1H,56px));box-shadow:0 2px 0 var(--accent)}
.statwrap.ov tbody tr.pin1:last-of-type td{box-shadow:0 2px 0 var(--accent)}
.navbar.pg{position:static;margin:0 0 8px;padding:0;background:none}
.nbio{display:flex;gap:8px}
.nbl{display:flex;gap:8px;justify-self:start}
.navbar>.nb:last-child{justify-self:end}
.rk{font-size:12px;border-radius:5px;padding:0 5px;background:var(--chip)}
.rk.r1{background:#e8b923;color:#2a1a00}
.sheet table th.pc,.sheet table td.pc{min-width:70px}
tr.sec th{background:var(--sec);text-align:left;font-size:13px}
.sheet table th,.sheet table td{border-left:1px solid var(--line)}
.sheet table th:first-child,.sheet table td:first-child{border-left:0}
.statwrap{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:8px;margin-top:10px}
.statwrap table{border-collapse:separate;border-spacing:0;min-width:100%}
.statwrap th,.statwrap td{border-bottom:1px solid var(--line)}
.statwrap thead th{position:sticky;top:0;z-index:3;background:var(--card)}
.statwrap td:first-child,.statwrap th:first-child{position:sticky;left:0;z-index:2;min-width:170px;text-align:left}
.statwrap thead th:first-child{z-index:4}
.statwrap tbody td{background:var(--card)}
.statwrap tbody tr.z td{background:var(--zebra)}
.statwrap tr.sec th{position:sticky;left:0}
.tot2{font-size:18px}
tr.h1 th,tr.h2 th{position:sticky;background:var(--card);z-index:4}
tr.h1 th{top:var(--topH,0px)}
tr.h2 th{top:calc(var(--topH,0px) + var(--h1H,0px));font-size:20px;font-weight:800;border-bottom:2px solid var(--accent)}
tr.h2 th:nth-child(2){font-size:13px;font-weight:600;color:var(--mute)}
tr.h1 th.deal{box-shadow:inset 0 -3px 0 var(--accent)}
tr.h1 th.pc.rk{padding-top:20px!important}
.rnk{position:absolute;top:2px;left:3px;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;text-align:center;padding:0 4px;z-index:1}
th .nm{font-weight:700}
th .tag{font-size:11px;font-weight:400;color:var(--mute)}
th.gone{opacity:.7}
.top .banner{margin:6px 0 0}
.banner.orange{background:#f6ad3c;color:#2a1a00;border-left:0}
.p.gone{opacity:.65;background:var(--chip)}
.gls{display:flex;justify-content:center;gap:4px;margin-bottom:3px}
.gl{font-size:12px;font-weight:800;width:20px;height:20px;line-height:20px;border-radius:5px;color:#fff}
.opn{color:#b7791f;font-weight:700}
.hit{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer;background:var(--card);font-size:14px}
.hit:hover{border-color:var(--accent)}
.help h3{margin:16px 0 4px;font-size:16px}
.help h4.hsub{margin:14px 0 4px;font-size:15px;border-top:1px solid var(--line);padding-top:8px}
.htoc{display:flex;flex-direction:column;gap:2px;margin:8px 0;padding:8px 12px;background:var(--chip);border-radius:10px}.htoc a{color:var(--ink);padding:3px 0;font-weight:600;text-decoration:none}
.help ul{padding-left:20px;margin:6px 0}.help li{margin:4px 0}
.help table{font-size:14px;margin:6px 0}
.sheet h3{margin:14px 0 4px;font-size:15px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;max-width:90vw;box-shadow:0 4px 14px #0005}
.mlabel{font-size:9px;font-weight:800;letter-spacing:.03em;color:var(--mute);align-self:center}
.gls{flex-wrap:wrap;align-items:center}
@media(min-width:640px){.gls{flex-wrap:nowrap}#app tr.h1 th.pc{min-width:132px}}
.gl.green{background:#1f9d55}
.gl.red{background-color:#c0392b;color:#ffd0cb;background-image:linear-gradient(to top right,transparent calc(50% - 1.5px),#fff calc(50% - 1.5px),#fff calc(50% + 1.5px),transparent calc(50% + 1.5px)),linear-gradient(to bottom right,transparent calc(50% - 1.5px),#fff calc(50% - 1.5px),#fff calc(50% + 1.5px),transparent calc(50% + 1.5px))}
.statwrap.ov thead tr:first-child th{min-height:38px;white-space:nowrap}
.statwrap.ov thead tr:nth-child(2) th{top:var(--r1H,38px)}
/* Diagramme der Statistik */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-top:10px}
.chartcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.chartcard h3{margin:0 0 2px;font-size:15px}
.chartcard .muted{margin:0 0 6px}
.chartcard.wide{grid-column:1/-1}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-top:6px}
.legend span.it{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.donut{display:block;width:100%;max-width:230px;margin:0 auto}
.donut path{stroke:var(--card);stroke-width:2}
.donut path:hover,.hb i:hover{opacity:.8}
.donut text{fill:var(--ink);font-family:inherit}
.hrow{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.hrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{display:flex;gap:2px;height:20px;background:transparent}
.hb i{display:block;min-width:0;border-radius:0 4px 4px 0;height:100%}
.hb i:first-child{border-radius:0 4px 4px 0}
.hv{font-size:12px;color:var(--mute);margin-top:1px}
.linechart{display:block;width:100%;height:auto}
.linechart text{fill:var(--mute);font-size:11px;font-family:inherit}
.dsk{display:contents}
.menu-btn,.rn{display:none}
.selrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.selrow select{margin-bottom:8px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 12px;min-height:56px;font-size:16px;font-weight:600;text-align:left}
.menu-item span{font-size:22px}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.sheet{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.appt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}.appt.past{opacity:.75}.appt .at{font-size:17px;font-weight:700;margin:2px 0}.appt .arow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.appt .arow .btn{padding:8px 10px}
.chip.hol{background:#f3d3d0;color:#8a1f18}
textarea,input[type=time]{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;font:inherit}
.datelab{align-self:center;font-weight:600}
.cal{margin:8px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}.calnav{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:6px}.calnav .btn{padding:4px 12px;min-width:40px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.calgrid .cw{text-align:center;font-size:12px;color:var(--mute);font-weight:700}.calgrid .cw.sat{color:var(--c1)}.calgrid .cw.sun{color:var(--bad)}
.cd{aspect-ratio:1/1;min-height:36px;border:1px solid transparent;border-radius:8px;background:var(--chip);color:var(--ink);font-weight:600;position:relative;padding:0}.cd.empty{background:none}
.cd.sat{background:#cfe0f7;color:#12457f}.cd.sun,.cd.hol{background:#f3c9c5;color:#8a1f18}.cd.hol.reg{background:#f8e0dd}
.cd.today{border-color:var(--ink)}.cd.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.cd.has::after{content:'';position:absolute;bottom:3px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.callegend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mute);margin-top:6px}.callegend .btn{padding:4px 10px;margin-left:auto}.lg{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}.lg.sat{background:#cfe0f7}.lg.sun,.lg.hol{background:#f3c9c5}.lg.has{background:var(--warn);border-radius:50%}
.calhol{margin-top:4px}.whobox{display:flex;flex-wrap:wrap;gap:2px 14px}
.logrow{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c1);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}.logrow.verschoben{border-left-color:var(--c2)}.logrow.gelöscht{border-left-color:var(--bad)}.logrow.geändert{border-left-color:var(--c4)}.logrow .chg{margin-top:2px}
.wapre{white-space:pre-wrap;background:var(--chip);padding:10px;border-radius:8px;font-family:inherit;font-size:13px;line-height:1.4;margin:4px 0}
.nextappt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px;cursor:pointer;font-size:14px}
@media (prefers-color-scheme:dark){.chip.hol{background:#5a2724;color:#ffd5d1}.cd.sat{background:#27425f;color:#bcd8fb}.cd.sun,.cd.hol{background:#5d2c29;color:#ffd5d1}.cd.hol.reg{background:#442523}}
.home{max-width:520px;margin:0 auto;padding:8px 0 24px}.homelogo{display:flex;justify-content:center;cursor:pointer;margin:6px 0 8px}.homelogo svg{width:min(240px,60vw,36vh);height:auto}.hometitle{text-align:center;margin:0 0 2px}.homemain{margin-bottom:10px}.homemain .menu-item{width:100%;justify-content:center;font-size:18px;min-height:64px}.menu-item.prim{background:var(--accent,#17382a);color:#fff;border-color:transparent}.homebar{margin-top:12px}
.mlabel{font-size:10px}
/* Handy und kleine Tablets: Menü statt vieler Knöpfe, Spielzeilen als Karten mit Zahlenreihe */
@media(max-width:900px){
  #app tr.h1 th.pc{min-width:0!important}
  .wrap{padding:0 10px}
  .dsk{display:none}
  .tlogo{display:none!important}
  .menu-btn{display:inline-block}
  .top{position:static;padding:6px 0} /* am Handy scrollt die Leiste mit, fest bleiben nur Namen und Summen */
  .top .banner{font-size:13px;padding:6px 10px;margin:4px 0 0}
  .card{padding:6px;margin:8px 0}
  table.gt,table.gt thead,table.gt tbody{display:block}
  table.gt{font-size:13px}
  table.gt thead{position:sticky;top:0;z-index:4;background:var(--card)}
  table.gt tr{display:grid;grid-template-columns:repeat(var(--np),minmax(0,1fr)) 68px}
  table.gt tr.h1 th:nth-child(-n+2),table.gt tr.h2 th:nth-child(-n+2){display:none}
  table.gt tr.h1 th,table.gt tr.h2 th{position:static;padding:4px 2px;overflow:hidden}
  table.gt tr.h1 th.pc{position:relative;top:auto}
  .gls{gap:2px}.gl{width:17px;height:17px;line-height:17px;font-size:10px;border-radius:4px}.mlabel{flex-basis:100%;text-align:center} /* G R F in einer Zeile */
  table.gt tr.h2 th{font-size:17px}
  table.gt tr.h2 th:last-child{font-size:13px}
  table.gt tr.h1 th.deal{box-shadow:inset 0 -3px 0 var(--accent)}
  table.gt th .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.gt td,table.gt th{border-left:1px solid var(--line)}
  table.gt tr.row td:nth-child(1){display:none}
  table.gt tr.row td:nth-child(2){grid-column:1/-1;border-left:0;border-bottom:0;padding:8px 6px 4px}
  table.gt tr.row td:nth-child(n+3){padding:4px 2px;text-align:center;font-size:15px;border-bottom:1px solid var(--line);border-top:1px dashed var(--line)}
  table.gt tr.row td:nth-child(3){border-left:0}
  table.gt tr.row{border-bottom:0}
  #app tr.cyc td:nth-child(n+3){border-bottom:4px solid var(--ink)}
  #app tr.cyc td:nth-child(2){border-bottom:0}
  .rn{display:inline;font-weight:800;color:var(--mute)}
  .statwrap table{font-size:12.5px}
  .statwrap th,.statwrap td{padding:6px 3px}
  .statwrap td:first-child,.statwrap th:first-child{min-width:92px;padding-left:6px}
  .sheet table th.pc,.sheet table td.pc{min-width:50px}
  .fab{right:12px;bottom:12px;padding:12px 16px;font-size:16px}
  .seg button{padding:10px 12px;min-height:40px}
  .btn{min-height:40px}
  .btn.sm{min-height:34px}
  .chk input{width:24px;height:24px}
  input[type=text],input[type=number],input[type=time],select{padding:10px;min-height:42px;font-size:16px}textarea{font-size:16px}
  .statwrap{max-height:62vh}
}
/* niedrige Bildschirme (Querformat am Handy): Kopf nicht festkleben, nur Namen und Summen */
/* Breite Fenster (Windows/PC): Spielseite mit großer Kopfzeile (Name + Platzierung), großen Summen, großer Info-Leiste und großem laufenden/letzten Spiel, fest stehend.
   Die Größen richten sich nach der Fensterhöhe (hoch ≥ 1100 px, mittel 700–1099 px, niedrig < 700 px), damit im Browser-Tab genug Platz zum Scrollen bleibt. */
@media(min-width:901px){
  #app table.gt{border-collapse:separate;border-spacing:0}
  .top .banner{font-size:22px;font-weight:700;padding:12px 18px;margin:8px 0 0;border-radius:12px}
  #app tr.h1 th.pc .nm{font-size:30px;font-weight:800;line-height:1.2}
  #app tr.h1 th.pc .tag{font-size:15px}
  #app tr.h1 th.pc.rk{padding-top:36px!important}
  .rnk{min-width:32px;height:32px;line-height:32px;border-radius:16px;font-size:19px;top:4px;left:8px}
  .gl{width:26px;height:26px;line-height:26px;font-size:15px}
  .mlabel{font-size:12px}
  #app tr.h2 th{font-size:46px;line-height:1.1;padding-top:6px;padding-bottom:6px}
  #app tr.h2 th:nth-child(2){font-size:16px}
  #app tr.h2 th:last-child{font-size:24px}
  #app tr.big td{font-size:21px;background:var(--card);position:sticky;z-index:2}
  #app tr.big td.pc{font-size:38px;font-weight:800}
  #app tr.big td.num{font-size:34px}

<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>
<script>
/* ---------- Daten ---------- */
const KEY='formel1-logger-v1';
const COURSES0=['Austin','Nevada','Monaco','Deutschland','Belgien','GB','Brasilien','Buddh','Italien','Spanien','Portugal','Kanada','Singapur','Südafrika','Docks','Frankreich','Chicago','Sebring','New Jersey','Sotchi','Valencia','Baltimore'];
const NAMES0=['André','Guido','Karsten','Martin'];
const PTS0=[12,8,6,4,2,1];
const MAXP=8;
const byName=(a,b)=>String(a).localeCompare(String(b),'de');
const newSeasonObj=(name,players,points,id)=>({id:id||Date.now(),name,start:new Date().toISOString(),players:[...players],points:[...points]});
function fixSeason(s){s.players=(s.players||[]).filter(Boolean).slice(0,MAXP);s.points=[...(s.points||[])];while(s.points.length<6)s.points.push(0);s.points=s.points.slice(0,6).map(x=>+x||0);return s}
function normalize(o){
  o=o&&typeof o==='object'?o:{};
  o.season=fixSeason(o.season||newSeasonObj('Saison 1',NAMES0,PTS0,1));
  o.pastSeasons=(o.pastSeasons||[]).map(fixSeason);
  o.days=Array.isArray(o.days)?o.days:[];
  o.cur=o.cur||null;
  o.days.forEach(d=>{if(d.season==null)d.season=o.season.id;d.res=d.res||{}});
  if(o.cur){o.cur.res=o.cur.res||{};if(o.cur.season==null)o.cur.season=o.season.id}
  o.courses=Array.isArray(o.courses)&&o.courses.length?o.courses:[...COURSES0];
  [...o.days,...(o.cur?[o.cur]:[])].forEach(d=>{if(d.kurs&&!o.courses.includes(d.kurs))o.courses.push(d.kurs)});
  const nl=new Set(o.nameList||[]);[o.season,...o.pastSeasons].forEach(s=>s.players.forEach(n=>nl.add(n)));o.days.forEach(d=>Object.keys(d.res).forEach(n=>nl.add(n)));
  o.nameList=[...nl].sort(byName);
  o.emails=o.emails||{};
  o.appts=Array.isArray(o.appts)?o.appts:[];o.apptLog=Array.isArray(o.apptLog)?o.apptLog:[];
  o.app='formel1-logger';
  return o;
}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
let S=normalize(load());
let lastSnap=null,undoStack=[];
function save(){
  const cur=JSON.stringify(S);
  if(lastSnap!==null&&cur!==lastSnap){undoStack.push(lastSnap);if(undoStack.length>80)undoStack.shift()}
  lastSnap=cur;
  try{localStorage.setItem(KEY,cur)}catch(e){}
}
function undo(){
  if(!undoStack.length)return;
  const prev=undoStack.pop();
  S=normalize(JSON.parse(prev));lastSnap=prev;
  try{localStorage.setItem(KEY,prev)}catch(e){}
  closeModal();render();
}
const undoBtn=()=>`<button class="btn sec" ${undoStack.length?'':'disabled'} onclick="undo()" title="Letzte Änderung zurücknehmen">↶ Rückgängig${undoStack.length?' ('+undoStack.length+')':''}</button>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let F=null,RF=null,SF=null;

/* ---------- Rechnen ---------- */
const seasonById=id=>id===S.season.id?S.season:S.pastSeasons.find(s=>s.id===id);
const seasonName=id=>(seasonById(id)||{name:'?'}).name;
const isCur=d=>d===S.cur;
function dayRows(d){
  const se=seasonById(d.season)||S.season;
  return Object.keys(d.res).sort(byName).map(n=>{const r=d.res[n]||{};const pts=(!r.st&&r.place)?(se.points[r.place-1]||0):0;return {name:n,start:r.start||null,place:r.place||null,st:r.st||null,pts}});
}
function raceNo(d){const l=S.days.filter(x=>x.season===d.season);const i=l.indexOf(d);return i>=0?i+1:l.length+1}
const fmtDay=d=>d&&d.date?fmtDE(String(d.date).slice(0,10)):'';
const dd=d=>d&&d.date?' · '+fmtDay(d):'';
let VIEWSEASON=null; // null = aktuelle Saison, 'all' = alle
const viewSeason=()=>VIEWSEASON==null?S.season.id:VIEWSEASON;
function daysOf(sel,withCur){
  const l=S.days.filter(d=>sel==='all'||d.season===sel);
  if(withCur&&S.cur&&(sel==='all'||sel===S.season.id)&&Object.values(S.cur.res).some(r=>r.place||r.st))l.push(S.cur);
  return l;
}
function namesOf(days,extra){const s=new Set(extra||[]);days.forEach(d=>Object.keys(d.res).forEach(n=>s.add(n)));return [...s].sort(byName)}
function totalsOf(days){
  const t={},c={};
  days.forEach(d=>dayRows(d).forEach(r=>{t[r.name]=(t[r.name]||0)+r.pts;c[r.name]=(c[r.name]||0)+1}));
  return {t,c};
}
function ranksOf(t,names){const rk={};names.forEach(n=>{rk[n]=1+names.filter(o=>(t[o]||0)>(t[n]||0)).length});return rk} // 1. = meiste Punkte, Gleichstand = gleicher Platz
const ptsTxt=se=>se.points.slice(0,Math.min(6,Math.max(se.players.length,1))).join(' / ');
const unplayed=()=>S.courses.filter(c=>!S.days.some(d=>d.season===S.season.id&&d.kurs===c)&&!(S.cur&&S.cur.kurs===c));

/* ---------- Start, Spielseite ---------- */
let HOME=true;
function goHome(){closeModal();HOME=true;render();window.scrollTo(0,0)}
function goApp(){closeModal();HOME=false;render();window.scrollTo(0,0)}
function home(){
  const it=(ic,t,fn,cls)=>`<button class="menu-item ${cls||''}" onclick="${fn}"><span>${ic}</span>${t}</button>`;
  const main=S.cur?it('▶','Spieltag fortsetzen ('+esc(S.cur.kurs)+')','goApp()','prim'):it('＋','Neuer Spieltag','goApp()','prim');
  const items=[...(S.cur?[it('⚙','Einstellungen','openSettings()'),it('🗑','Spieltag verwerfen','discardDay()')]:[]),it('📋','Gesamtansicht','openOverview()'),it('📊','Statistik','openStats()'),it('🏆','Saisons','openSeasons()'),it('📅','Termine','openAppts()'),it('📤','Export / Senden','openExport()'),it('📥','Import','openImport()'),it('🔍','Suche','openSearch()'),it('❓','Hilfe','openHelp()'),it('ℹ','Info','openInfo()')];
  return `<div class="home">${navBar(null,true)}<div class="homelogo" onclick="openInfo()">${logoSvg(0,240)}</div><h1 class="hometitle">${APP_NAME}</h1><div class="muted" style="text-align:center;margin-bottom:14px">${APP_TAG}<br><small>Version ${APP_VERSION} · ${esc(S.season.name)}</small></div><div class="homemain">${main}</div>${nextApptLine()}<div class="menu-grid">${items.join('')}</div></div>`;
}
function render(){
  document.getElementById('app').innerHTML=HOME?home():S.cur?board():setup();
  fixSticky();
}
function fixSticky(){
  const t=document.getElementById('topbar'),h1=document.querySelector('tr.h1'),r=document.documentElement.style;
  const topH=t&&getComputedStyle(t).position==='sticky'?t.offsetHeight:0;
  r.setProperty('--topH',topH+'px');
  r.setProperty('--h1H',h1?h1.offsetHeight+'px':'0px');
  const h2=document.querySelector('tr.h2'),bigs=[...document.querySelectorAll('tr.big')];
  r.setProperty('--h2H',h2?h2.offsetHeight+'px':'0px');
  r.setProperty('--p1H',bigs[0]?bigs[0].offsetHeight+'px':'0px');
  document.querySelectorAll('table.gt th .nm').forEach(e=>{e.style.fontSize='';let s=parseFloat(getComputedStyle(e).fontSize);while(e.scrollWidth>e.clientWidth+0.5&&s>9){s-=.5;e.style.fontSize=s+'px'}}); // Namen schrumpfen, bis sie in die Spalte passen
  const head=topH+(h1?h1.offsetHeight:0)+(h2?h2.offsetHeight:0),stack=head+bigs.reduce((a,x)=>a+x.offsetHeight,0);
  document.body.classList.toggle('pinOff',stack>innerHeight*0.6);
  document.body.classList.toggle('headOff',head>innerHeight*0.55);
}
window.addEventListener('resize',fixSticky);
let _wl=null;
async function keepAwake(){
  try{
    if(!('wakeLock' in navigator)||!matchMedia('(min-width:901px) and (hover:hover)').matches)return;
    if(_wl&&!_wl.released)return;
    _wl=await navigator.wakeLock.request('screen');
    _wl.addEventListener('release',()=>{_wl=null});
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});
window.addEventListener('focus',keepAwake);
document.addEventListener('click',keepAwake);
keepAwake();

/* Neuer Spieltag (Einrichtung) */
let SU=null;
function setup(){
  const se=S.season;
  if(!SU||SU.season!==se.id)SU={season:se.id,kurs:'',other:false,date:ymd(new Date()),parts:[...se.players]};
  const free=unplayed();
  if(!SU.other&&!free.includes(SU.kurs))SU.kurs=free[0]||'';
  const names=[...se.players].sort(byName);
  const bad=!(SU.other?SU.kursTxt&&SU.kursTxt.trim():SU.kurs)||SU.parts.length<2;
  return `${navBar('goHome()',true)}<h1 style="display:flex;align-items:center;gap:10px;cursor:pointer" onclick="goHome()" title="Startbildschirm">${logoSvg(0,40)} ${APP_NAME}</h1>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;align-items:center">${undoBtn()}<button class="btn sec menu-btn" onclick="openMenu()">☰ Menü</button><span class="dsk"><button class="btn sec" onclick="openOverview()">📋 Gesamtansicht</button><button class="btn sec" onclick="openStats()">📊 Statistik</button><button class="btn sec" onclick="openSeasons()">🏆 Saisons</button><button class="btn sec" onclick="openExport()">📤 Export / Senden</button>${helpBtns()}<button class="btn sec" onclick="openImport()">📥 Import</button></span></div>
  <div class="card">
  <div class="prev" style="margin:0 0 6px;font-weight:400"><b>${esc(se.name)}</b> · ${se.players.length} Spieler · Punkte Platz 1–${Math.min(6,se.players.length)}: ${ptsTxt(se)} · ${S.days.filter(d=>d.season===se.id).length} Rennen gespielt <button class="btn sec sm" onclick="openSeasonEdit(${se.id})">Saison bearbeiten</button></div>
  <label>Kurs (noch nicht gespielt in dieser Saison)</label>
  <select onchange="suKurs(this.value)">${free.map(c=>`<option value="${esc(c)}" ${!SU.other&&SU.kurs===c?'selected':''}>${esc(c)}</option>`).join('')}<option value="__new" ${SU.other?'selected':''}>Anderer Kurs …</option></select>
  ${SU.other?`<input type="text" id="suOther" style="margin-top:6px" placeholder="Name des Kurses" value="${esc(SU.kursTxt||'')}" oninput="SU.kursTxt=this.value;suBtn()">`:''}
  <label>Datum</label><input type="date" value="${esc(SU.date)}" onchange="SU.date=this.value">
  <label>Wer fährt mit?</label>
  <div class="whobox">${names.map(n=>`<label class="chk"><input type="checkbox" ${SU.parts.includes(n)?'checked':''} onchange="suPart('${esc(n).replace(/'/g,"\\'")}',this.checked)"> ${esc(n)}</label>`).join('')}</div>
  <p class="muted">Wer nicht mitfährt, wird gar nicht gezählt. Wer eingetragen ist, aber nicht fährt, wird später als „nicht angetreten“ vermerkt. Startplätze und Ergebnis trägst du nach dem Start über „Ergebnis eintragen“ ein.</p>
  <button class="btn" id="suGo" ${bad?'disabled':''} onclick="startDay()">Spieltag starten</button>
  </div>`;
}
function suKurs(v){if(v==='__new'){SU.other=true;SU.kursTxt=''}else{SU.other=false;SU.kurs=v}render();const e=document.getElementById('suOther');if(e)e.focus()}
function suBtn(){const b=document.getElementById('suGo');if(b)b.disabled=!((SU.kursTxt||'').trim())||SU.parts.length<2}
function suPart(n,on){const i=SU.parts.indexOf(n);if(on&&i<0)SU.parts.push(n);if(!on&&i>=0)SU.parts.splice(i,1);suBtn()}
function startDay(){
  const kurs=(SU.other?(SU.kursTxt||'').trim():SU.kurs);
  if(!kurs||SU.parts.length<2)return;
  if(!S.courses.includes(kurs))S.courses.push(kurs);
  const res={};SU.parts.forEach(n=>{res[n]={start:null,place:null,st:null}});
  S.cur={id:Date.now(),season:S.season.id,date:SU.date||ymd(new Date()),kurs,res};
  SU=null;HOME=false;save();render();
}
function board(){
  const d=S.cur,se=S.season;
  const done=S.days.filter(x=>x.season===se.id);
  const {t}=totalsOf(done);
  const names=namesOf([...done,d],se.players);
  const rk=ranksOf(t,names),anyDone=done.length>0;
  const cr=Object.fromEntries(dayRows(d).map(r=>[r.name,r]));
  const hh=names.map(n=>{const r=cr[n];const tag=!r?'nicht dabei':r.st==='dns'?'nicht angetreten':r.st==='dnf'?'ausgefallen'+(r.start?' · Start '+r.start:''):r.place?'Platz '+r.place+(r.start?' · Start '+r.start:''):(r.start?'Start '+r.start:'');
    return `<th class="pc${anyDone?' rk':''}${r?'':' gone'}">${anyDone?`<span class="rnk" title="Platz in der Saison">${rk[n]}</span>`:''}<div class="nm">${esc(n)}</div><div class="tag">${tag}</div></th>`}).join('');
  const tt=names.map(n=>`<th class="pc tot">${t[n]||0}</th>`).join('');
  const rowOf=(x,big)=>{
    const rr=Object.fromEntries(dayRows(x).map(r=>[r.name,r]));let sum=0;
    const cells=names.map(n=>{const r=rr[n];if(!r)return `<td class="pc muted"></td>`;sum+=r.pts;
      const tg=r.st==='dns'?'n.a.':r.st==='dnf'?'ausg.'+(r.start?' S'+r.start:''):r.place?'P'+r.place+(r.start?' · S'+r.start:''):(r.start?'S'+r.start:'');
      return `<td class="pc ${r.st?'lost':''}"><b>${x===d&&!r.place&&!r.st?'-':r.pts}</b><div class="tag">${tg}</div></td>`}).join('');
    const cur=x===d;
    return `<tr class="row ${big}" onclick="rowTap(${cur?-1:S.days.indexOf(x)})" title="${cur?'Antippen: Ergebnis eintragen':'Doppelklick: Rennen öffnen'}"><td>${raceNo(x)}</td><td><span class="rn">${raceNo(x)}.</span> <b>${esc(x.kurs)}</b>${dd(x)}${cur?' <span class="opn">läuft</span>':''}</td>${cells}<td class="num"><b>${cur?'':sum}</b></td></tr>`;
  };
  const rows=[rowOf(d,'big big1'+(done.length?'':' bigLast')),...done.slice().reverse().map((x,i)=>rowOf(x,i===0?'big big2 bigLast':''))].join('');
  const ban=`<div class="banner orange">Spieltag: <b>${esc(d.kurs)}</b>${dd(d)} · Rennen ${raceNo(d)} der ${esc(se.name)}${Object.values(d.res).some(r=>r.place||r.st)?' · Ergebnis noch nicht abgeschlossen':' · Ergebnis fehlt noch'}</div>`;
  return `<div class="top" id="topbar">${navBar('goHome()',true)}<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="tlogo" onclick="goHome()" style="cursor:pointer;display:inline-flex" title="Startbildschirm">${logoSvg(0,34)}</span>${undoBtn()}<button class="btn sec menu-btn" onclick="openMenu()">☰ Menü</button><span class="dsk"><button class="btn sec" onclick="openSettings()">⚙ Einstellungen</button><button class="btn sec" onclick="openOverview()">📋 Gesamtansicht</button><button class="btn sec" onclick="openStats()">📊 Statistik</button><button class="btn sec" onclick="openSeasons()">🏆 Saisons</button><button class="btn sec" onclick="openExport()">📤 Export / Senden</button>${helpBtns()}</span></div>${ban}</div>
  <div class="card"><table class="gt${names.length>5?' dense':''}" style="--np:${names.length}"><thead><tr class="h1"><th>#</th><th>Rennen</th>${hh}<th class="num">Σ</th></tr>
  <tr class="h2"><th></th><th>Punkte in der Saison</th>${tt}<th class="num" title="Summe aller Punkte der Saison">Σ ${Object.values(t).reduce((a,b)=>a+b,0)}</th></tr></thead>
  <tbody>${rows}</tbody></table></div>
  <p class="muted">Zahl = Punkte im Rennen, darunter P = Endplatz, S = Startplatz, ausg. = ausgefallen, n.a. = nicht angetreten.</p>
  <button class="btn fab" onclick="openRace(-1)">Ergebnis eintragen</button>`;
}
let LASTTAP={i:-2,t:0};
function rowTap(i){
  if(i===-1){openRace(-1);return}
  const now=Date.now();
  if(LASTTAP.i===i&&now-LASTTAP.t<600){LASTTAP={i:-2,t:0};openRace(i)}else LASTTAP={i,t:now};
}

/* ---------- Rennmaske ---------- */
function openRace(idx){
  const d=idx===-1?S.cur:S.days[idx];if(!d)return;
  RF={idx,kurs:d.kurs,other:false,kursTxt:'',date:d.date||'',res:JSON.parse(JSON.stringify(d.res))};
  drawRace();
}
function modalSheet(html,keepScroll){
  const m=document.getElementById('modal'),old=m.querySelector('.sheet'),y=keepScroll&&old?old.scrollTop:0;
  m.innerHTML=`<div class="modal"><div class="sheet">${navBar('closeModal()')}${html}</div></div>`;
  if(y){const s=m.querySelector('.sheet');if(s)s.scrollTop=y}
}
const rfNames=()=>Object.keys(RF.res).sort(byName);
const zielVal=r=>r.st?r.st:r.place?'p'+r.place:'';
function rfCheck(){
  const names=rfNames(),errs=[],N=names.length;
  const fin=names.filter(n=>RF.res[n].place&&!RF.res[n].st).map(n=>RF.res[n].place).sort((a,b)=>a-b);
  names.forEach(n=>{const r=RF.res[n];if(!r.st&&!r.place)errs.push(n+': Ergebnis fehlt');else if(r.st!=='dns'&&!r.start)errs.push(n+': Startplatz fehlt')});
  fin.forEach((p,i)=>{if(p!==i+1&&!errs.some(e=>e.startsWith('Plätze')))errs.push('Plätze müssen lückenlos bei 1 beginnen (ohne Ausgefallene)')});
  if(!RF.kurs&&!(RF.other&&(RF.kursTxt||'').trim()))errs.push('Kurs fehlt');
  return errs;
}
function drawRace(){
  const d=RF.idx===-1?S.cur:S.days[RF.idx],se=seasonById(d.season)||S.season;
  const names=rfNames(),N=names.length,res=RF.res;
  const usedS=new Set(names.map(n=>res[n].start).filter(Boolean)),usedP=new Set(names.filter(n=>!res[n].st).map(n=>res[n].place).filter(Boolean));
  const q=n=>esc(n).replace(/'/g,"\\'");
  const rows=names.map(n=>{
    const r=res[n],dns=r.st==='dns';
    const so=[`<option value="">–</option>`,...[...Array(N).keys()].map(i=>`<option value="${i+1}" ${r.start===i+1?'selected':''} ${usedS.has(i+1)&&r.start!==i+1?'disabled':''}>${i+1}</option>`)].join('');
    const zo=[`<option value="" ${zielVal(r)===''?'selected':''}>–</option>`,...[...Array(N).keys()].map(i=>`<option value="p${i+1}" ${zielVal(r)==='p'+(i+1)?'selected':''} ${usedP.has(i+1)&&r.place!==i+1?'disabled':''}>Platz ${i+1}</option>`),`<option value="dnf" ${r.st==='dnf'?'selected':''}>Ausgefallen</option>`,`<option value="dns" ${dns?'selected':''}>Nicht angetreten</option>`].join('');
    const pts=(!r.st&&r.place)?(se.points[r.place-1]||0):null;
    return `<div class="rrow"><div class="rn2" title="${esc(n)}">${esc(n)}</div><select ${dns?'disabled':''} onchange="rfSet('${q(n)}','start',this.value)">${so}</select><select onchange="rfSet('${q(n)}','ziel',this.value)">${zo}</select><div class="rpt">${pts==null?(r.st?'0':'·'):pts}</div></div>`}).join('');
  const errs=rfCheck(),ok=!errs.length;
  const order=names.filter(n=>res[n].place&&!res[n].st).sort((a,b)=>res[a].place-res[b].place);
  const prev=order.length?order.map(n=>res[n].place+'. '+esc(n)+' ('+(se.points[res[n].place-1]||0)+')').join(' · '):'Noch kein Platz vergeben.';
  const dnf=names.filter(n=>res[n].st==='dnf'),dns=names.filter(n=>res[n].st==='dns');
  const free=S.courses.filter(c=>c===RF.kurs||(!S.days.some(x=>x.season===d.season&&x.kurs===c&&x!==d)));
  const isNew=RF.idx===-1,closed=!isNew;
  modalSheet(`<h1>${closed?'Rennen '+raceNo(d)+' ändern':'Ergebnis eintragen'}</h1>
  <div class="row2" style="grid-template-columns:1.3fr 1fr"><div><label>Kurs</label><select onchange="rfKurs(this.value)">${free.map(c=>`<option value="${esc(c)}" ${!RF.other&&RF.kurs===c?'selected':''}>${esc(c)}</option>`).join('')}<option value="__new" ${RF.other?'selected':''}>Anderer Kurs …</option></select></div>
  <div><label>Datum</label><input type="date" value="${esc((RF.date||'').slice(0,10))}" onchange="RF.date=this.value"></div></div>
  ${RF.other?`<input type="text" style="margin-top:6px" placeholder="Name des Kurses" value="${esc(RF.kursTxt)}" oninput="RF.kursTxt=this.value;rfBtn()">`:''}
  <div class="rrow h"><div>Spieler</div><div>Start</div><div>Ziel</div><div style="text-align:right">Pkt</div></div>
  ${rows}
  <div class="prev">${prev}${dnf.length?'<div class="muted">Ausgefallen: '+dnf.map(esc).join(', ')+'</div>':''}${dns.length?'<div class="muted">Nicht angetreten: '+dns.map(esc).join(', ')+'</div>':''}</div>
  ${errs.length?`<p class="muted" id="rfErr">Zum Abschließen fehlt noch: ${errs.map(esc).join(' · ')}</p>`:''}
  <div class="btnbar">${closed?`<button class="btn sec" style="margin-right:auto" onclick="delRace()">🗑 Löschen</button>`:''}${isNew?`<button class="btn ${ok?'sec':''}" onclick="saveRace(false)">Zwischenspeichern</button>`:''}<button class="btn" id="rfGo" ${ok?'':'disabled'} onclick="saveRace(true)">${isNew?'Rennen abschließen':'Speichern'}</button><button class="btn sec" onclick="closeModal()">Abbrechen</button></div>`,true);
}
function rfBtn(){const e=rfCheck(),b=document.getElementById('rfGo');if(b)b.disabled=!!e.length}
function rfKurs(v){if(v==='__new'){RF.other=true;RF.kursTxt=''}else{RF.other=false;RF.kurs=v}drawRace()}
function rfSet(n,k,v){
  const r=RF.res[n];
  if(k==='start')r.start=v?+v:null;
  else{
    if(v===''){r.place=null;r.st=null}
    else if(v==='dnf'){r.st='dnf';r.place=null}
    else if(v==='dns'){r.st='dns';r.place=null;r.start=null}
    else{r.st=null;r.place=+v.slice(1)}
  }
  drawRace();
}
function saveRace(final){
  const d=RF.idx===-1?S.cur:S.days[RF.idx];
  if(final&&rfCheck().length){drawRace();return}
  const kurs=RF.other?(RF.kursTxt||'').trim():RF.kurs;
  if(!kurs){toast('Bitte einen Kurs wählen.');return}
  if(!S.courses.includes(kurs))S.courses.push(kurs);
  d.kurs=kurs;d.date=RF.date||d.date;d.res=RF.res;
  if(final&&RF.idx===-1){S.days.push(d);S.cur=null;save();closeModal();HOME=true;render();window.scrollTo(0,0);toast('Rennen '+raceNo(d)+' ('+kurs+') abgeschlossen');return}
  save();closeModal();render();
  if(!final)toast('Zwischengespeichert');
}
function delRace(){
  const d=S.days[RF.idx];if(!d)return;const i=RF.idx;
  ask(`Rennen ${raceNo(d)} (${esc(d.kurs)}${dd(d)}) löschen?`,'Weiter …',()=>ask('Wirklich endgültig löschen? Das Rennen verschwindet aus allen Auswertungen. „↶ Rückgängig“ kann es zurückholen, solange die App offen bleibt; sicherer ist vorher ein Export.','Ja, Rennen endgültig löschen',()=>{S.days.splice(i,1);save();render();toast('Rennen gelöscht')}));
}
function discardDay(){
  if(!S.cur)return;
  ask(`Laufenden Spieltag (${esc(S.cur.kurs)}) verwerfen?`,'Weiter …',()=>ask('Wirklich verwerfen? Alle bisher eingetragenen Startplätze und Ergebnisse dieses Spieltags gehen verloren.','Ja, Spieltag verwerfen',()=>{S.cur=null;SU=null;save();HOME=true;render()}));
}

function openSeasonEdit(id){

function drawSeasonEdit(msg){
  const nw=SF.id==null;
  modalSheet(`<h1>${nw?'Neue Saison':'Saison bearbeiten'}</h1>
  <label>Name der Saison</label><input type="text" value="${esc(SF.name)}" placeholder="z. B. 2027/2028" oninput="SF.name=this.value">

  <label>Punkte je Platz (Platz 7 und 8 sowie Ausgefallene und nicht Angetretene bekommen 0)</label>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${SF.points.map((v,i)=>`<div><label style="margin:0 0 2px">Platz ${i+1}</label><input type="number" min="0" step="1" inputmode="numeric" value="${v}" oninput="SF.points[${i}]=+this.value||0"></div>`).join('')}</div>
  ${nw?'<p class="muted">Die aktuelle Saison wird abgeschlossen und gespeichert. Der Spieltag muss vorher beendet sein.</p>':'<p class="muted">Ändern der Punkte rechnet alle Rennen dieser Saison neu. Ein umbenannter Spieler wird in allen Rennen der Saison umbenannt.</p>'}
  ${msg?`<p class="lost">${esc(msg)}</p>`:''}
  <div class="btnbar"><button class="btn" onclick="saveSeasonEdit()">${nw?'Saison anlegen':'Speichern'}</button><button class="btn sec" onclick="closeModal()">Abbrechen</button></div>`,true);

function sfAdd(){if(SF.players.length<MAXP){SF.players.push({orig:null,name:''});drawSeasonEdit()}}
function sfDel(i){SF.players.splice(i,1);drawSeasonEdit()}
function saveSeasonEdit(){
  const name=SF.name.trim(),pl=SF.players.map(p=>({orig:p.orig,name:p.name.trim()})).filter(p=>p.name);
  if(!name){drawSeasonEdit('Bitte einen Namen für die Saison eingeben.');return}
  if(pl.length<2){drawSeasonEdit('Mindestens 2 Spieler nötig.');return}
  if(new Set(pl.map(p=>p.name)).size!==pl.length){drawSeasonEdit('Ein Name kommt doppelt vor.');return}
  const points=SF.points.map(x=>Math.max(0,+x||0));
  if(SF.id==null){
    if(S.cur){drawSeasonEdit('Bitte zuerst den laufenden Spieltag abschließen oder verwerfen.');return}
    S.pastSeasons.push({...S.season,end:new Date().toISOString()});
    S.season=fixSeason({id:Date.now(),name,start:new Date().toISOString(),players:pl.map(p=>p.name),points});
    VIEWSEASON=null;SU=null;
  }else{
    const se=seasonById(SF.id);
    const ren={};pl.forEach(p=>{if(p.orig&&p.orig!==p.name)ren[p.orig]=p.name});
    if(Object.keys(ren).length){[...S.days,...(S.cur?[S.cur]:[])].filter(d=>d.season===se.id).forEach(d=>{const r={};Object.keys(d.res).forEach(n=>{r[ren[n]||n]=d.res[n]});d.res=r})}
    se.name=name;se.players=pl.map(p=>p.name);se.points=points;fixSeason(se);SU=null;
  }
  S.nameList=S.nameList.filter(n=>!Object.keys(SF.players.reduce((a,p)=>{if(p.orig&&p.orig!==p.name.trim())a[p.orig]=1;return a},{})).includes(n));S=normalize(S);save();closeModal();render();toast('Saison gespeichert');
}

let SHEETSTACK=[]; // zuvor geöffnete Fenster (z. B. Gesamtansicht → Statistik → zurück zur Gesamtansicht)

function quitApp(){
  if(androidApp()&&androidApp().closeApp){androidApp().closeApp();return} // Android: ganze App schließen
  // Windows-Programm: der Host beendet alle Fenster und sich selbst (auch wenn mehrere Fenster offen sind)
  fetch('/quit',{method:'POST'}).then(r=>{if(!r.ok)throw 0}).catch(()=>{
    window.close();
    setTimeout(()=>toast('Hier lässt sich das Fenster nicht per Knopf schließen – bitte den Tab bzw. die App selbst schließen. Alle Daten sind gespeichert.',6000),500);
  });
}
// ← links, ⚙ (nur Import-/Export-Ordner) in der Mitte, ✕ rechts (schließt das aktuelle Fenster, auf dem Startbildschirm die App); page=true für Seiten (nicht schwebend in Fenstern)
function navBar(back,page){

  const x=page?(back?'goHome()':'quitApp()'):'closeModal()',xt=page&&!back?'Anwendung schließen':'Fenster schließen';

function tieK(names,rk,n){return Math.min(4,names.filter(o=>rk[o]===rk[n]).length)<2?0:Math.min(4,names.filter(o=>rk[o]===rk[n]).length)}
const isMartin=n=>/^\s*martin\s*$/i.test(n||'');
/* Podest-Symbol: Platz 1–3 = Männchen auf der jeweiligen Stufe, Platz 4 = gestolpertes Männchen neben der Treppe */
function podiumIcon(rank,w,tie,martin){
  // tie: Anzahl der Spieler auf diesem Platz (0 = allein, sonst 2–4: das linke Männchen schwarz, alle anderen grau). Bei Martin schubst das schwarze alle grauen (sie stürzen nach rechts); bei allen anderen stürzt das schwarze nach links.
  w=w||72;tie=tie||0;
  const steps=[[2,2,18,26,'#b8c0c8'],[1,20,18,18,'#e8b923'],[3,38,18,32,'#c98b52']]; // Platz, x, Breite, Oberkante, Farbe
  const base=40,DARK='var(--ink)',LIGHT='#aab0b6';
  const blocks=steps.map(([r,x,sw,top,c])=>`<rect x="${x}" y="${top}" width="${sw}" height="${base-top}" fill="${rank===r?c:'var(--line)'}" stroke="var(--mute)" stroke-width=".6"/><text x="${x+sw/2}" y="${base-3}" font-size="8" text-anchor="middle" fill="var(--ink)" opacity=".7">${r}</text>`).join('');
  // Männchen mit Füßen im Ursprung; arms: 'up' Arme hoch, 'push' Arme nach rechts, 'pushL' nach links, sonst Arme hängend
  const man=(arms,col)=>{
    const fig=`stroke="${col}" stroke-width="1.8" stroke-linecap="round" fill="none"`;
    const a=arms==='up'?'M0 -8L-4 -13M0 -8L4 -13':arms==='push'?'M0 -8L7 -9M0 -8L-4 -5':arms==='pushL'?'M0 -8L-7 -9M0 -8L4 -5':'M0 -8L-4 -5M0 -8L4 -5';
    return `<circle cx="0" cy="-12" r="3" fill="${col}"/><path ${fig} d="M0 -9V-3M0 -3L-3 0M0 -3L3 0M${a}"/>`;
  };
  let f;
  if(rank>=1&&rank<=3){
    const st=steps.find(x=>x[0]===rank),x0=st[1],sw=st[2],top=st[3];
    if(tie>=2){
      const slot=i=>x0+(i+.5)*sw/tie;
      f=[...Array(tie).keys()].map(i=>{
        const col=i?LIGHT:DARK; // ganz links schwarz, alle anderen grau
        if(martin)return i?`<g transform="translate(${slot(i)} ${top}) rotate(62)">${man('up',col)}</g>`:`<g transform="translate(${slot(i)} ${top})">${man('push',col)}</g>`; // Martin (schwarz) schubst alle grauen
        return i?`<g transform="translate(${slot(i)} ${top})">${man('',col)}</g>`:`<g transform="translate(${x0+2} ${top}) rotate(-62)">${man('up',col)}</g>`; // sonst stürzt das schwarze nach links
      }).join('');
    }
    else f=`<g transform="translate(${x0+sw/2} ${top})">${man(rank===1?'up':'',DARK)}</g>`;
  }else f=`<text x="66" y="17" font-size="11" font-weight="800" text-anchor="middle" fill="var(--ink)">${rank}</text><g transform="translate(66 40)">${man('',DARK)}</g>`;
  const lab=rank<=3?rank+'. Platz'+(tie?' (Gleichstand)':''):rank+'. Platz';
  return `<svg class="podi" viewBox="-10 0 86 42" width="${Math.round(w*86/76)}" height="${Math.round(w*86/76*42/86)}" role="img" aria-label="${lab}">${blocks}${f}</svg>`;
}
function fixOv(){
  const w=document.querySelector('#modal .statwrap.ov');if(!w)return;
  const th=w.querySelector('thead'),r1=th&&th.querySelector('tr'),p1=w.querySelector('tbody tr.pin1');
  w.style.setProperty('--r1H',(r1?r1.offsetHeight:38)+'px');
  w.style.setProperty('--hdH',(th?th.offsetHeight:76)+'px');
  w.style.setProperty('--p1H',(p1?p1.offsetHeight:56)+'px');

const rkChip=r=>r.st==='dns'?'<span class="rk rg">n.a.</span>':r.st==='dnf'?'<span class="rk rd">ausg.</span>':r.place?`<span class="rk r${r.place}">${r.place}.</span>`:'';
function openOverview(){
  const sel=viewSeason(),list=daysOf(sel,true);
  const names=namesOf(list,sel===S.season.id?S.season.players:[]);
  const {t,c}=totalsOf(list);

let STATVIEW='charts',STATSEL='all',STATPL=null,STATMX='all';
const nf1=v=>(Math.round(v*10)/10).toLocaleString('de-DE');
const plCol=k=>['#e8b923','#b8c0c8','#c98b52','var(--c1)','var(--c3)','var(--c7)','var(--c2)','var(--c5)'][k-1];
function computeStats(days){
  const names=namesOf(days);
  const N=Math.min(MAXP,Math.max(4,...days.map(d=>Object.keys(d.res).length),0));
  const st={};
  names.forEach(n=>{st[n]={n,races:0,started:0,fin:0,dnf:0,dns:0,pts:0,pl:Array(N+2).fill(0),pole:0,poleWin:0,sSum:0,sCnt:0,pSum:0,gain:0,gainCnt:0,bestGain:null,maxPts:0,podium:0,starts:Array(N+2).fill(0),mx:{}}});
  const cum={};names.forEach(n=>{cum[n]=0});
  const series=names.map(()=>[]),labels=[];
  days.forEach(d=>{
    const rows=dayRows(d),byN=Object.fromEntries(rows.map(r=>[r.name,r]));
    rows.forEach(r=>{
      const s=st[r.name];s.races++;
      if(r.st==='dns'){s.dns++;return}
      s.started++;
      if(r.start){s.sSum+=r.start;s.sCnt++;if(r.start<=N)s.starts[r.start]++;if(r.start===1)s.pole++}
      const key=r.st==='dnf'?'dnf':r.place;
      if(r.start&&key){const m=s.mx[r.start]=s.mx[r.start]||{};m[key]=(m[key]||0)+1}
      if(r.st==='dnf'){s.dnf++;return}
      if(!r.place)return;
      s.fin++;s.pl[Math.min(r.place,N+1)]++;s.pts+=r.pts;s.pSum+=r.place;s.maxPts=Math.max(s.maxPts,r.pts);if(r.place<=3)s.podium++;
      if(r.start){const g=r.start-r.place;s.gain+=g;s.gainCnt++;if(s.bestGain==null||g>s.bestGain)s.bestGain=g;if(r.start===1&&r.place===1)s.poleWin++}
    });
    names.forEach((n,i)=>{cum[n]+=(byN[n]?byN[n].pts:0);series[i].push(cum[n])});
    labels.push('R'+raceNo(d));
  });
  return {names,N,st,series,labels};
}

  let h='';
  const card=(t,sub,body,wide)=>`<div class="chartcard${wide?' wide':''}"><h3>${t}</h3><p class="muted">${sub}</p>${body}</div>`;

  if(!STATPL||!names.includes(STATPL))STATPL=names[0];

  }
  const ser=[...Array(N).keys()].map(i=>({l:'Platz '+(i+1),c:plCol(i+1)})).concat([{l:'ausgefallen',c:'var(--bad)'},{l:'nicht angetreten',c:'var(--mute)'}]);
  const rows=names.map(n=>({name:n,vals:[...Array(N).keys()].map(i=>st[n].pl[i+1]).concat([st[n].dnf,st[n].dns]),s:st[n]}));
  h+=card('Platzierungen je Spieler','Anzahl je Platz, Ausfälle und nicht angetreten',hbarsHTML(rows,ser,r=>`${r.s.fin} gewertet · ${r.s.dnf} ausgefallen · ${r.s.dns} nicht angetreten · ${r.s.pts} Punkte`)+legendHTML(ser.map(x=>({...x,v:0,pct:false})),()=>''),true);
  if(series.length&&labels.length>=2&&viewSeason()!=='all'){

  }
  return `<div class="charts">${h}</div>`;
}

  // Startplatz → Endplatz (Matrix)
  const who=STATMX==='all'||!names.includes(STATMX)?names:[STATMX];

  const cols=[...Array(N).keys()].map(i=>i+1);

  return `<div class="statwrap"><table><thead><tr><th></th>${names.map(n=>`<th class="pc">${esc(n)}</th>`).join('')}</tr></thead><tbody>${b}</tbody></table></div>

  ${mtab}<p class="muted">Zeile = Startplatz, Spalte = Endplatz: wie oft ein Rennen von diesem Startplatz aus auf diesem Platz endete. „ausg.“ = ausgefallen.</p>`;

/* ---------- Diagramme (SVG/HTML, ohne Bibliothek) ---------- */
const colVar=i=>`var(--c${(i%8)+1})`;
const nf=n=>Math.round(n).toLocaleString('de-DE');
function legendHTML(items,fmt){
  const tot=items.reduce((s,x)=>s+x.v,0);
  return `<div class="legend">${items.map(x=>`<span class="it"><i class="sw" style="background:${x.c}"></i>${esc(x.l)} <b>${fmt?fmt(x):nf(x.v)}</b>${tot&&x.pct!==false?` <span class="muted">${Math.round(100*x.v/tot)} %</span>`:''}</span>`).join('')}</div>`;
}
function donutSVG(items,aria,big,small){
  const tot=items.reduce((s,x)=>s+x.v,0);
  if(!tot)return '<p class="muted">Noch keine Daten.</p>';
  const cx=110,cy=110,R=100,r=60;let a0=-Math.PI/2,paths='';
  const pt=(a,rad)=>[(cx+rad*Math.cos(a)).toFixed(2),(cy+rad*Math.sin(a)).toFixed(2)];
  items.forEach(x=>{
    if(!x.v)return;
    const frac=x.v/tot,a1=a0+frac*2*Math.PI;let d;
    if(frac>=0.9999){d=`M${cx} ${cy-R}A${R} ${R} 0 1 1 ${cx-0.01} ${cy-R}L${cx-0.01} ${cy-r}A${r} ${r} 0 1 0 ${cx} ${cy-r}Z`}
    else{const [x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[x2,y2]=pt(a1,r),[x3,y3]=pt(a0,r),lg=frac>.5?1:0;
      d=`M${x0} ${y0}A${R} ${R} 0 ${lg} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${lg} 0 ${x3} ${y3}Z`}
    paths+=`<path d="${d}" fill="${x.c}"><title>${esc(x.l)}: ${x.t||nf(x.v)} (${Math.round(frac*100)} %)</title></path>`;
    a0=a1;
  });
  return `<svg class="donut" viewBox="0 0 220 220" role="img" aria-label="${esc(aria)}">${paths}<text x="110" y="${small?108:118}" text-anchor="middle" font-size="22" font-weight="800">${esc(big)}</text>${small?`<text x="110" y="130" text-anchor="middle" font-size="12" style="fill:var(--mute)">${esc(small)}</text>`:''}</svg>`;
}
function hbarsHTML(rows,series,fmtRow){
  const max=Math.max(1,...rows.map(r=>r.vals.reduce((a,b)=>a+b,0)));
  return rows.map(r=>`<div class="hrow"><div class="nm" title="${esc(r.name)}">${esc(r.name)}</div><div><div class="hb">${r.vals.map((v,i)=>v?`<i style="width:${(100*v/max).toFixed(2)}%;background:${series[i].c}" title="${esc(r.name)} · ${esc(series[i].l)}: ${v}"></i>`:'').join('')}</div><div class="hv">${fmtRow(r)}</div></div></div>`).join('');
}
function lineSVG(labels,series,aria){
  const W=Math.max(290,Math.min(640,innerWidth-64)),H=250,L=44,Rr=12,T=12,B=34,n=labels.length;
  const mx=Math.max(1,...series.flatMap(s=>s.vals));
  const step=Math.pow(10,Math.floor(Math.log10(mx/4)));const nice=[1,2,2.5,5,10].map(k=>k*step).find(k=>mx/k<=5)||step*10;
  const top=Math.ceil(mx/nice)*nice;
  const X=i=>n<2?L+(W-L-Rr)/2:L+i*(W-L-Rr)/(n-1),Y=v=>T+(H-T-B)*(1-v/top);
  let g='';
  for(let v=0;v<=top+0.001;v+=nice){g+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--grid)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${nf(v)}</text>`}
  const every=Math.ceil(n/Math.max(2,Math.floor((W-L)/62)));
  labels.forEach((l,i)=>{if((i%every===0&&(n-1-i>=every*0.6||i===0))||i===n-1)g+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle">${esc(l)}</text>`});
  g+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--mute)" stroke-width="1"/>`;
  series.forEach(s=>{
    g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${s.vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/>`;
    // viele Spieltage: nur der letzte Punkt sichtbar, die anderen unsichtbar (Tooltip bleibt), sonst verdecken die Punkte die Linie

  if(!f){toast('Keine Datei gewählt');return}
  const r=new FileReader();
  r.onload=()=>loadImport(r.result);
  r.onerror=()=>toast('Datei konnte nicht gelesen werden');
  r.readAsText(f);
}

const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const ymdParse=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'],WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const dayLabel=s=>{const d=ymdParse(s);return d?WD[d.getDay()]+', '+pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.'+d.getFullYear():(s||'–')};
// Datum aus Eingabe wie 24.10.2026, 24.10.26, 24.10. (aktuelles Jahr) oder 2026-10-24; sonst null
function parseDate(txt){
  const t=String(txt||'').trim();let y,m,d,x;
  if((x=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(t))){y=+x[1];m=+x[2];d=+x[3]}
  else if((x=/^(\d{1,2})\.\s*(\d{1,2})\.?\s*(\d{2}|\d{4})?$/.exec(t))){d=+x[1];m=+x[2];y=x[3]?(+x[3]<100?2000+ +x[3]:+x[3]):new Date().getFullYear()}
  else return null;
  const dt=new Date(y,m-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)return null;
  return ymd(dt);
}
const addDays=(s,k)=>{const d=ymdParse(s);return ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()+k))};
const fmtDE=s=>{const d=ymdParse(s);return d?pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.'+d.getFullYear():''};
// Feiertage (Deutschland): bundesweit und regional (nicht in jedem Bundesland), Ostern nach Gauß/Anonymous-Gregorian
const _hol={};
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function holidays(y){
  if(_hol[y])return _hol[y];
  const H={},E=easter(y),add=(d,n,reg)=>{H[ymd(d)]={n,reg:!!reg}},off=k=>new Date(y,E.getMonth(),E.getDate()+k);
  add(new Date(y,0,1),'Neujahr');add(off(-2),'Karfreitag');add(off(0),'Ostersonntag');add(off(1),'Ostermontag');add(new Date(y,4,1),'Tag der Arbeit');
  add(off(39),'Christi Himmelfahrt');add(off(49),'Pfingstsonntag');add(off(50),'Pfingstmontag');add(new Date(y,9,3),'Tag der Deutschen Einheit');
  add(new Date(y,11,25),'1. Weihnachtstag');add(new Date(y,11,26),'2. Weihnachtstag');
  add(new Date(y,0,6),'Heilige Drei Könige',1);add(off(60),'Fronleichnam',1);add(new Date(y,7,15),'Mariä Himmelfahrt',1);add(new Date(y,9,31),'Reformationstag',1);add(new Date(y,10,1),'Allerheiligen',1);
  const n23=new Date(y,10,23);add(new Date(y,10,23-((n23.getDay()+7-3)%7||7)),'Buß- und Bettag',1); // Mittwoch vor dem 23.11.
  return _hol[y]=H;
}
const holidayOf=s=>{const d=ymdParse(s);return d?holidays(d.getFullYear())[s]||null:null};

const REMINDERS=[[0,'keine'],[15,'15 Minuten vorher'],[60,'1 Stunde vorher'],[180,'3 Stunden vorher'],[1440,'1 Tag vorher'],[2880,'2 Tage vorher']];
const REPEATS=[['none','einmalig'],['weekly','jede Woche'],['biweekly','alle 2 Wochen'],['monthly','jeden Monat']];
const remText=m=>(REMINDERS.find(r=>r[0]===+m)||[0,'keine'])[1];
const repText=a=>a.repeat&&a.repeat!=='none'?(REPEATS.find(r=>r[0]===a.repeat)||[0,''])[1]+', '+(a.count||1)+' Termine':'einmalig';
const timeText=a=>a.allDay?'ganztägig':(a.start||'')+(a.end?' – '+a.end+' Uhr':' Uhr');
// alle Termin-Tage einer (wiederholten) Serie
function occurrences(a){
  const d0=ymdParse(a.date);if(!d0)return[];
  const n=a.repeat&&a.repeat!=='none'?Math.max(1,Math.min(+a.count||1,200)):1,out=[];
  for(let i=0;i<n;i++){
    const d=new Date(d0);
    if(a.repeat==='weekly')d.setDate(d0.getDate()+7*i);else if(a.repeat==='biweekly')d.setDate(d0.getDate()+14*i);
    else if(a.repeat==='monthly'){d.setMonth(d0.getMonth()+i,1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(d0.getDate(),last))}
    out.push(ymd(d));
  }
  return out;
}
const apptOn=s=>S.appts.filter(a=>occurrences(a).includes(s));
const apptSort=(a,b)=>(a.date+(a.allDay?'00:00':a.start||'')).localeCompare(b.date+(b.allDay?'00:00':b.start||''));

const APPT_FIELDS=[['title','Titel',a=>a.title],['date','Datum',a=>dayLabel(a.date)],['start','Beginn',a=>a.allDay?'ganztägig':a.start||'–'],['end','Ende',a=>a.allDay?'–':a.end||'–'],['allDay','Ganztägig',a=>a.allDay?'ja':'nein'],['place','Ort',a=>a.place||'–'],['who','Teilnehmer',a=>(a.who||[]).join(', ')||'–'],['notes','Notizen',a=>a.notes||'–'],['remind','Erinnerung',a=>remText(a.remind)],['repeat','Wiederholung',a=>repText(a)],['count','Anzahl',a=>String(a.count||1)],['tentative','Status',a=>a.tentative?'vorläufig':'fest']];
function apptDiff(o,n){
  const ch=[];
  APPT_FIELDS.forEach(([k,l,f])=>{const x=JSON.stringify(o[k]??''),y=JSON.stringify(n[k]??'');if(x!==y){
    if(k==='start'&&o.allDay!==n.allDay)return; // Beginn/Ende ergeben sich aus „Ganztägig“
    if(k==='end'&&o.allDay!==n.allDay)return;
    if(k==='count'&&o.repeat==='none'&&n.repeat==='none')return;
    ch.push({f:l,from:f(o),to:f(n)})}});
  return ch;
}

/* --- Kalender-Datei (.ics, funktioniert in Android, iOS/iPhone und Windows/Outlook) --- */
const icsEsc=s=>String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function icsFold(line){
  const enc=new TextEncoder();let out='',cur='',len=0;
  for(const ch of line){const b=enc.encode(ch).length;if(len+b>73){out+=cur+'\r\n ';cur='';len=1}cur+=ch;len+=b}
  return out+cur;
}
const icsDT=(date,time)=>date.replace(/-/g,'')+'T'+(time||'00:00').replace(':','')+'00';
function icsEvent(a,stamp){
  const L=['BEGIN:VEVENT','UID:'+a.id+'@f1log.local','DTSTAMP:'+stamp,'SEQUENCE:'+(a.seq||0),'SUMMARY:'+icsEsc(a.title||'Formel-1-Abend')];
  if(a.allDay){const d=ymdParse(a.date),n=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);L.push('DTSTART;VALUE=DATE:'+a.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+ymd(n).replace(/-/g,''))}
  else{
    let endDate=a.date;const st=a.start||'19:00',en=a.end||'';
    if(!en){const [h,m]=st.split(':').map(Number);const e=new Date(2000,0,1,h+3,m);endDate=e.getDate()>1?addDays(a.date,1):a.date;L.push('DTSTART:'+icsDT(a.date,st),'DTEND:'+icsDT(endDate,pad2(e.getHours())+':'+pad2(e.getMinutes())))}
    else{if(en<=st)endDate=addDays(a.date,1);L.push('DTSTART:'+icsDT(a.date,st),'DTEND:'+icsDT(endDate,en))}
  }
  if(a.place)L.push('LOCATION:'+icsEsc(a.place));
  const desc=[a.notes||'',(a.who&&a.who.length?'Mitspieler: '+a.who.join(', '):'')].filter(Boolean).join('\n');
  if(desc)L.push('DESCRIPTION:'+icsEsc(desc));
  L.push('STATUS:'+(a.tentative?'TENTATIVE':'CONFIRMED'),'TRANSP:OPAQUE','CATEGORIES:Formel 1');
  if(a.repeat&&a.repeat!=='none'){const f=a.repeat==='monthly'?'FREQ=MONTHLY;INTERVAL=1':a.repeat==='biweekly'?'FREQ=WEEKLY;INTERVAL=2':'FREQ=WEEKLY;INTERVAL=1';L.push('RRULE:'+f+';COUNT='+Math.max(1,+a.count||1))}
  if(+a.remind>0)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(a.title||'Formel-1-Abend'),'TRIGGER:-PT'+(+a.remind)+'M','END:VALARM');
  L.push('END:VEVENT');return L;
}
function buildIcs(list){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//F1-Log//Termine//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Formel-1-Termine'];
  list.forEach(a=>L.push(...icsEvent(a,stamp)));L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n')+'\r\n';
}
function apptText(a){
  const occ=occurrences(a);
  return '🏎 Formel-1-Termin: '+(a.title||'Formel-1-Abend')+'\n'+dayLabel(a.date)+' · '+timeText(a)+(a.place?'\nOrt: '+a.place:'')+(a.who&&a.who.length?'\nMitspieler: '+a.who.join(', '):'')+(occ.length>1?'\nWiederholung: '+repText(a):'')+(a.notes?'\n'+a.notes:'')+(a.tentative?'\n(vorläufig)':'');
}
// mode: 'cal' = in den Kalender des Geräts übernehmen, 'save' = Datei speichern, 'share' = Einladung teilen
async function icsOut(name,text,mode,msg){
  const A=androidApp();
  if(A){
    if(mode==='cal'&&typeof A.openCalendar!=='undefined'){A.openCalendar(name,text);return}
    if(mode==='share'){A.shareFile(name,text,msg||'');return}
    A.saveFile(name,text);return;
  }
  let file=null;try{file=new File([text],name,{type:'text/calendar'})}catch(e){}
  if((mode==='cal'||mode==='share')&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share(mode==='share'?{files:[file],title:'Formel-1-Termin',text:msg||''}:{files:[file],title:'Formel-1-Termin'});return}catch(e){if(e&&e.name==='AbortError')return}
  }
  if(mode==='share'&&msg&&!(file&&navigator.canShare)){sendTextWhatsApp(msg)}
  await saveText(name,text,'text/calendar');
  if(mode==='cal')toast('Datei gespeichert: '+name+' – zum Eintragen im Kalender öffnen (Doppelklick bzw. antippen).',7000);
}
const apptFile=a=>'f1-termin-'+a.date+'.ics';
function exportAppt(id,mode){const a=S.appts.find(x=>x.id===id);if(!a)return;icsOut(apptFile(a),buildIcs([a]),mode,apptText(a))}
function waAppt(id){
  const t=todayStr(),list=id?S.appts.filter(a=>a.id===id):S.appts.filter(a=>occurrences(a).some(d=>d>=t)).sort(apptSort);

  waDialog({title:'Einladung',text:list.map(apptText).join('\n\n'),name:id?apptFile(list[0]):'f1-termine.ics',content:buildIcs(list),mime:'text/calendar'});
}
function exportAllAppts(mode){
  const t=todayStr(),list=S.appts.filter(a=>occurrences(a).some(d=>d>=t)).sort(apptSort);
  if(!list.length){toast('Keine kommenden Termine vorhanden');return}
  icsOut('f1-termine.ics',buildIcs(list),mode,list.map(apptText).join('\n\n'));
}

function applyFavicon(){
  let l=document.getElementById('fav');if(!l){l=document.createElement('link');l.id='fav';l.rel='icon';document.head.appendChild(l)}
  l.href='data:image/svg+xml,'+encodeURIComponent(LOGOS[0].svg);
}
const helpBtns=()=>`<button class="btn sec" onclick="openSearch()">🔍 Suche</button><button class="btn sec" onclick="openHelp()">❓ Hilfe</button><button class="btn sec" onclick="openInfo()">ℹ Info</button>`;
function openMenu(){
  const it=(ic,t,fn)=>`<button class="menu-item" onclick="${fn}"><span>${ic}</span>${t}</button>`;
  const items=[it('🏠','Startbildschirm','goHome()'),...(S.cur?[it('⚙','Einstellungen','openSettings()')]:[]),it('📋','Gesamtansicht','openOverview()'),it('📊','Statistik','openStats()'),it('🏆','Saisons','openSeasons()'),it('📅','Termine','openAppts()'),it('📤','Export / Senden','openExport()'),...(S.cur?[]:[it('📥','Import','openImport()')]),it('🔍','Suche','openSearch()'),it('❓','Hilfe','openHelp()'),it('ℹ','Info','openInfo()')];
  showSheet(`<h1>Menü</h1><div class="menu-grid">${items.join('')}</div><div style="margin-top:12px"><button class="btn sec" onclick="closeModal()">Schließen</button></div>`);
}
function openInfo(){
  showSheet(`<div style="display:flex;gap:14px;align-items:center;margin-bottom:6px">${logoSvg(0,72)}<div><h1 style="margin:0">${APP_NAME}</h1><div class="muted">${APP_TAG}</div></div></div>
  <table style="margin:8px 0"><tbody>
  <tr><td>Versionsstand</td><td><b>${APP_VERSION}</b></td></tr>
  <tr><td>Erzeugungsdatum</td><td><b>${new Date(APP_BUILD).toLocaleDateString('de-DE',{day:'2-digit',month:'long',year:'numeric'})}</b></td></tr>
  <tr><td>Hersteller</td><td><b>Martin mit Claude</b></td></tr>
  <tr><td>Gespeicherte Daten</td><td>${S.days.length} abgeschlossene Rennen in ${S.pastSeasons.length+1} Saison(s)<br><span class="muted">liegen lokal in diesem Browser bzw. dieser App</span></td></tr>
  </tbody></table>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn" onclick="openHelp()">Hilfe</button>${webMode()?'<button class="btn sec" onclick="checkUpdate(true)">Nach Update suchen</button>':''}<button class="btn sec" onclick="closeModal()">Schließen</button></div>`);
}

/* ---------- Hilfe und Suche ---------- */
const HELP=[
{id:'os',t:'1. Betriebssysteme und Versionen',h:`<p>Aktueller Stand: <b>Version ${APP_VERSION}</b>. Es ist immer dieselbe App; sie läuft als <b>Android-App (F1Log.apk, ab Android 7.0, getestet auf Huawei P10 mit Android 9)</b> und als <b>Web-App</b> in jedem aktuellen Browser (Chrome, Edge, Safari, Firefox) auf PC, Handy und Tablet, auch auf iPhone und iPad („Zum Home-Bildschirm“).</p>`},
{id:'install',t:'2. Installation und Updates',h:`<ul><li><b>Android (APK):</b> <b>F1Log.apk</b> aufs Handy kopieren, antippen und „Installation aus dieser Quelle zulassen“ bestätigen. Update: neue APK einfach über die alte installieren, die Daten bleiben. Meldet Android „App nicht installiert“, die alte App erst über <b>Export</b> sichern, deinstallieren, neue installieren und per <b>Import</b> zurückholen.</li>
<li><b>Web-App:</b> die Adresse <b>https://snoopy-wup.github.io/formel1-logger/</b> öffnen. Android (Chrome): Menü ⋮ → „App installieren“. iPhone (Safari): Teilen → „Zum Home-Bildschirm“.</li>
<li><b>Updates der Web-App</b> kommen von selbst („Neue Version … verfügbar – jetzt laden“), die Daten bleiben erhalten. Von Hand: <b>Info → Nach Update suchen</b>.</li></ul>`},
{id:'grund',t:'3. Grundeinstellungen einrichten',h:`<ol><li><b>Saison anlegen:</b> 🏆 Saisons → <b>Neue Saison</b>. Dort legst du Namen der Saison, die <b>Spieler (1 bis 8, Namen frei)</b> und die <b>Punkte für Platz 1–6</b> fest. Das gilt jeweils nur für diese Saison. Mit <b>⚙ Einstellungen → Saison bearbeiten</b> änderst du es später (Punkte rechnen alle Rennen der Saison neu, umbenannte Spieler werden überall umbenannt).</li>
<li><b>Ablageordner und E-Mail:</b> ⚙ in der Mitte der Kopfleiste: Ordner für Import/Export (am PC in Chrome/Edge) und die <b>E-Mail-Adresse zu jedem Namen</b>.</li>
<li><b>Termine:</b> 📅 Termine für die Renntage anlegen und in den Kalender übernehmen oder verschicken.</li></ol>`},
{id:'speicher',t:'4. Wo die Daten liegen',h:`<p>Die Daten stehen <b>nicht in der App selbst</b>, sondern im Speicher des Geräts (Android-App: privater App-Speicher; Web-App: Speicher des Browsers). Sie bleiben bei Updates erhalten und gehen beim <b>Deinstallieren verloren</b>. Jedes Gerät hat einen eigenen Datenbestand. Zum Abgleich und zur Sicherung dienen <b>Export und Import</b>. Die Exportdatei enthält alles (Saisons, Rennen, Termine, E-Mail-Adressen), nicht den Ablageordner.</p>`},
{id:'mail',t:'5. E-Mail- und WhatsApp-Versand',h:`<ul><li><b>Export / Senden</b> bietet <b>💬 WhatsApp (Text + Datei)</b> und <b>✉ Per E-Mail senden</b>. Der Text enthält das Ergebnis des letzten Rennens und den Gesamtstand der Saison.</li>
<li><b>Android-App:</b> die E-Mail öffnet sich mit Empfängern, Betreff, Text und angehängter Datei. Beim ersten Mal die E-Mail-App wählen und „Immer“ antippen (zurücksetzen: Einstellungen → Apps → Standard-Apps).</li>
<li><b>Web-Version:</b> Eine Web-App kann keine E-Mail mit Anhang öffnen. Ein Fenster erklärt den Ablauf: die Datei wird im Download-Ordner gespeichert, die E-Mail öffnet sich ohne Anhang, den du selbst anhängst. Auf dem iPhone gibt es „E-Mail mit Datei (Teilen-Menü → Mail)“.</li></ul>`},
{id:'bedienung',t:'6. Bedienung im Überblick',h:`<ul><li><b>Neuer Spieltag:</b> Startbildschirm → „Neuer Spieltag“. <b>Kurs</b> aus dem Auswahlmenü wählen (nur Kurse, die in dieser Saison noch nicht gefahren wurden; „Anderer Kurs …“ legt einen neuen an), <b>Datum</b> prüfen und die <b>Teilnehmer</b> wählen. Dann „Spieltag starten“.</li>
<li><b>Ergebnis eintragen:</b> Je Spieler den <b>Startplatz</b> und das <b>Ziel</b> wählen: Platz 1, 2, 3 … oder <b>Ausgefallen</b> (im Rennen ausgeschieden) oder <b>Nicht angetreten</b>. Jeder Platz kann nur einmal vergeben werden. Die Plätze müssen lückenlos bei 1 beginnen (Ausgefallene zählen nicht mit). Die Punkte erscheinen sofort rechts. „Zwischenspeichern“ merkt den Stand, „Rennen abschließen“ übernimmt das Rennen in die Saison.</li>
<li><b>Spielseite:</b> oben die Spieler (<b>alphabetisch von links nach rechts</b>) mit Platz in der Saison und den Saisonpunkten, darunter das laufende und die bisherigen Rennen (neueste oben). Ein abgeschlossenes Rennen öffnet mit <b>Doppeltipp</b> und lässt sich korrigieren oder löschen.</li>
<li><b>Gesamtansicht:</b> alle Rennen mit Punkten, Endplatz und Startplatz je Spieler, Summen und Podest-Symbole.</li>
<li><b>Statistik:</b> Saison und Rennen wählen. <b>Diagramme</b> (Kuchen für Punkte, Siege, Ausfälle, nicht angetreten, Platzierungen und Startplätze je Spieler, Balken, Punkteverlauf) und <b>Tabelle</b> (Punkte, Teilnahme, Anzahl je Platz, Ausfälle, Startplätze, Aufholjagd, Matrix Startplatz → Endplatz).</li>
<li><b>Saisons:</b> Übersicht aller Saisons, Bearbeiten, Löschen (immer zwei Rückfragen), Neue Saison.</li>
<li><b>Rückgängig:</b> nimmt die letzte Änderung zurück, solange die App offen bleibt.</li>
<li><b>✕</b> schließt das Fenster, auf dem Startbildschirm die App. <b>🏠</b> geht zum Startbildschirm.</li></ul>`},
{id:'regeln',t:'7. Punkte und Wertung',h:`<ul><li>Die <b>Punkte für Platz 1–6</b> legst du je Saison fest (z. B. 12 / 8 / 6 / 4 / 2 / 1 bei sechs Spielern oder 10 / 6 / 3 / 2 bei vier Spielern). <b>Platz 7 und 8 bekommen 0 Punkte.</b></li>
<li><b>Ausgefallen</b> und <b>Nicht angetreten</b> geben 0 Punkte und zählen in der Statistik getrennt. Ein Ausgefallener belegt keinen Endplatz, die übrigen Plätze rücken nach.</li>
<li>Die <b>Wertung der Saison</b> ist die Summe der Punkte: die meisten Punkte = Platz 1, Gleichstand = gleicher Platz.</li>
<li><b>Startplätze</b> werden zu jedem Endplatz festgehalten. Die Statistik zeigt Ø Startplatz, Pole-Positions, Siege von Start 1, gewonnene Plätze (Start → Ziel) und die Matrix Startplatz → Endplatz.</li></ul>`},
];
const plainText=h=>h.replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/g,' ').replace(/\s+/g,' ');
const matchTerms=(text,terms)=>{const t=text.toLowerCase();return terms.every(x=>t.includes(x))};
let HELPQ='';
function openHelp(id,q){
  if(q!==undefined)HELPQ=q;
  const terms=HELPQ.toLowerCase().split(/\s+/).filter(Boolean);
  const list=HELP.filter(s=>!terms.length||matchTerms(s.t+' '+plainText(s.h),terms));
  showSheet(`<h1>Hilfe</h1><p class="muted">So funktioniert die App und so werden die Punkte gerechnet.</p>
  <input type="text" id="helpIn" placeholder="In der Hilfe suchen …" value="${esc(HELPQ)}" oninput="openHelp(undefined,this.value)">
  ${terms.length?'':`<div class="htoc">${HELP.map(x=>`<a href="#" onclick="document.getElementById('h-${x.id}').scrollIntoView();return false">${x.t}</a>`).join('')}</div>`}
  <div class="help">${list.length?list.map(s=>`<div class="hsec" id="h-${s.id}"><h3>${s.t}</h3>${s.h}</div>`).join(''):'<p class="muted">Nichts gefunden.</p>'}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn sec" onclick="openSearch(HELPQ)">🔍 In allen Daten suchen</button><button class="btn sec" onclick="closeModal()">Schließen</button></div>`);
  const el=document.getElementById('helpIn');
  if(q!==undefined&&el){el.focus();const v=el.value;el.value='';el.value=v}
  if(id){const t=document.getElementById('h-'+id);if(t)t.scrollIntoView()}
}
let SEARCHQ='';
function raceText(d){
  const rows=dayRows(d);
  return [d.kurs,fmtDay(d),seasonName(d.season),'rennen '+raceNo(d),...rows.map(r=>r.name+' '+(r.st==='dns'?'nicht angetreten fehlt':r.st==='dnf'?'ausgefallen ausfall':'platz '+r.place+(r.place===1?' sieger gewonnen':''))+(r.start?' start '+r.start+(r.start===1?' pole':''):''))].join(' ');
}
function openSearch(q){
  if(q!==undefined)SEARCHQ=q;
  const terms=SEARCHQ.toLowerCase().split(/\s+/).filter(Boolean);
  let out='';
  if(terms.length){
    const helpHits=HELP.filter(s=>matchTerms(s.t+' '+plainText(s.h),terms));
    out+=`<h3>Hilfe (${helpHits.length})</h3>`+(helpHits.map(s=>`<div class="hit" onclick="openHelp('${s.id}',SEARCHQ)">${s.t}</div>`).join('')||'<div class="muted">–</div>');
    const days=daysOf('all',true).slice().reverse();
    const hits=days.filter(d=>matchTerms(raceText(d),terms));
    out+=`<h3>Rennen (${hits.length})</h3>`+(hits.slice(0,60).map(d=>`<div class="hit" onclick="${isCur(d)?'closeModal();goApp()':`VIEWSEASON=${d.season};openStats('d${d.id}')`}"><span class="muted">${fmtDay(d)?fmtDay(d)+' · ':''}${esc(seasonName(d.season))} · Rennen ${raceNo(d)}</span><br><b>${esc(d.kurs)}</b>${isCur(d)?' (läuft)':''} · ${dayRows(d).filter(r=>r.place&&!r.st).sort((a,b)=>a.place-b.place).slice(0,3).map(r=>r.place+'. '+esc(r.name)).join(', ')}</div>`).join('')||'<div class="muted">–</div>');
  }else out='<p class="muted">Suche nach Kursen, Spielern, Saison, Datum … z. B. „Monaco“, „Martin Platz 1“, „ausgefallen Guido“, „2026“.</p>';
  showSheet(`<h1>Suche</h1><input type="text" id="searchIn" placeholder="Suchbegriff …" value="${esc(SEARCHQ)}" oninput="openSearch(this.value)">${out}
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn sec" onclick="openHelp()">❓ Hilfe</button><button class="btn sec" onclick="closeModal()">Schließen</button></div>`);
  const el=document.getElementById('searchIn');if(el){el.focus();const v=el.value;el.value='';el.value=v}
}

new MutationObserver(()=>document.body.classList.toggle('lock',!!document.getElementById('modal').firstChild)).observe(document.getElementById('modal'),{childList:true});
lastSnap=JSON.stringify(S);
applyFavicon();
render();
